<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音痴测试与音感训练器 (高阶和弦版)</title>
    <!-- 引入 Tailwind CSS 样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 防止双击选中文本 */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
        /* 按键按下的视觉反馈 */
        .key-active {
            transform: translateY(4px) scale(0.95) !important;
            box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.1) !important;
        }
        /* 和弦多选模式下的选中状态 */
        .key-selected {
            border-color: #3b82f6 !important;
            background-color: #eff6ff !important;
            transform: translateY(2px);
            box-shadow: 0 4px 6px -1px rgb(59 130 246 / 0.2), 0 2px 4px -2px rgb(59 130 246 / 0.2) !important;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 p-4 font-sans selection:bg-blue-200 no-select">
    <div class="max-w-2xl mx-auto pt-4 sm:pt-8 pb-12">
        
        <!-- 头部区域 -->
        <div class="text-center mb-6">
            <div class="flex items-center justify-center mb-2">
                <!-- 原生 SVG 替代 music 图标 -->
                <svg class="w-10 h-10 text-blue-600 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
                <h1 class="text-3xl font-bold text-slate-800">音感测试与训练器</h1>
            </div>
            <p class="text-slate-500">听音辨音，挑战高阶和弦盲测，测测你的音乐天赋！</p>
        </div>

        <!-- 模式切换卡片 (三通道) -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-1.5 flex gap-1 mb-6">
            <button id="btn-practice" class="flex-1 py-2.5 px-2 rounded-xl font-medium text-sm transition-all duration-200 bg-blue-50 text-blue-700 shadow-sm" onclick="switchMode('practice')">
                🎹 自由练习
            </button>
            <button id="btn-test" class="flex-1 py-2.5 px-2 rounded-xl font-medium text-sm transition-all duration-200 text-slate-500 hover:bg-slate-50" onclick="switchMode('test')">
                🎯 单音盲测
            </button>
            <button id="btn-chord" class="flex-1 py-2.5 px-2 rounded-xl font-medium text-sm transition-all duration-200 text-slate-500 hover:bg-slate-50" onclick="switchMode('chord')">
                🔥 和弦盲测 (高阶)
            </button>
        </div>

        <!-- 主内容区域 -->
        <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden">
            
            <!-- 状态展示区 (动态更新) -->
            <div id="screen-area" class="p-6 sm:p-8 text-center min-h-[180px] flex flex-col justify-center items-center bg-slate-900 text-white relative overflow-hidden">
                <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
                
                <!-- 内容由 JS 动态生成填充这里 -->
                <div id="screen-content" class="w-full z-10 flex flex-col items-center justify-center"></div>
            </div>

            <!-- 琴键区域 (动态生成) -->
            <div class="p-4 sm:p-8 bg-slate-50">
                <div id="keyboard" class="flex justify-between items-end gap-1 sm:gap-2">
                    <!-- 琴键由 JS 动态生成 -->
                </div>
            </div>

            <!-- 说明区域 -->
            <div class="bg-white p-6 border-t border-slate-100 flex items-start text-sm text-slate-500">
                <!-- 原生 SVG 替代 info 图标 -->
                <svg class="w-5 h-5 mr-3 text-slate-400 flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
                <div class="space-y-1">
                    <p><strong class="text-slate-700">什么是和弦盲测？</strong> 两个或多个不同的音同时响起，会交融在一起。高阶盲测将随机播放 2 个音（双音）或 3 个音（三和弦），你需要找出组成这个和弦的所有音符。</p>
                    <p>建议先在“自由练习模式”下用手指同时按下多个音感受和谐度，再来挑战高难度盲测！</p>
                </div>
            </div>

        </div>
    </div>

    <!-- 核心逻辑脚本 -->
    <script>
        // --- 1. 数据定义 ---
        const NOTES = [
            { id: 'C4', name: 'Do', freq: 261.63, color: 'bg-red-400', activeColor: 'bg-red-500' },
            { id: 'D4', name: 'Re', freq: 293.66, color: 'bg-orange-400', activeColor: 'bg-orange-500' },
            { id: 'E4', name: 'Mi', freq: 329.63, color: 'bg-yellow-400', activeColor: 'bg-yellow-500' },
            { id: 'F4', name: 'Fa', freq: 349.23, color: 'bg-green-400', activeColor: 'bg-green-500' },
            { id: 'G4', name: 'Sol', freq: 392.00, color: 'bg-cyan-400', activeColor: 'bg-cyan-500' },
            { id: 'A4', name: 'La', freq: 440.00, color: 'bg-blue-400', activeColor: 'bg-blue-500' },
            { id: 'B4', name: 'Si', freq: 493.88, color: 'bg-indigo-400', activeColor: 'bg-indigo-500' },
            { id: 'C5', name: 'Do', freq: 523.25, color: 'bg-purple-400', activeColor: 'bg-purple-500' }
        ];

        // --- 2. SVG 图标库 (原生，无外部依赖) ---
        const SVGS = {
            music: `<svg class="w-10 h-10 text-blue-600 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>`,
            playCircle: `<svg class="w-4 h-4 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>`,
            volume2: `<svg class="w-3.5 h-3.5 mr-1.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`,
            checkCircle: `<svg class="w-5 h-5 mr-2 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`,
            xCircle: `<svg class="w-5 h-5 mr-2 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`,
            refreshCw: `<svg class="w-4 h-4 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>`
        };

        // --- 3. 状态变量 ---
        let currentMode = 'practice'; // 'practice', 'test' (单音), 'chord' (和弦高阶)
        let activeNoteId = null; // 用于练习模式单音高亮
        
        // 单音盲测状态
        let targetNote = null;
        let testStatus = 'idle'; // 'idle', 'waiting', 'result'
        let score = { correct: 0, total: 0 };
        let feedback = null;

        // 和弦盲测状态
        let targetChordNotes = []; // 存放当前播放的目标音符数组 [note, note...]
        let selectedNotes = [];    // 用户当前选择的音符数组 [noteId, noteId...]
        let chordDifficulty = 2;   // 2表示双音，3表示三和弦
        let chordScore = { correct: 0, total: 0 };

        let audioCtx = null;

        // --- 4. 音频逻辑 ---
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // 播放单个音，带有特定发声时间，防止多音并发时互相阻碍
        function playSingleTone(freq, startTime, duration = 1.5) {
            const ctx = getAudioContext();
            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(freq, startTime);

            // 包络控制
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(0.2, startTime + 0.05); // 稍微拉低单个音增益，防止多音同响爆音
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);

            oscillator.start(startTime);
            oscillator.stop(startTime + duration);
        }

        // 播放和弦 (支持数组传入)
        function playChord(notesArray) {
            const ctx = getAudioContext();
            const now = ctx.currentTime;
            notesArray.forEach(note => {
                playSingleTone(note.freq, now, 1.8);
            });
        }

        // --- 5. 业务逻辑 ---
        function handleNoteClick(noteId) {
            getAudioContext();

            // 1. 练习模式
            if (currentMode === 'practice') {
                const note = NOTES.find(n => n.id === noteId);
                playSingleTone(note.freq, getAudioContext().currentTime);
                triggerKeyActiveAnimation(note);

                activeNoteId = note.id;
                renderScreen();
                setTimeout(() => {
                    if (activeNoteId === note.id) {
                        activeNoteId = null;
                        renderScreen();
                    }
                }, 500);
                return;
            }

            // 2. 单音盲测模式
            if (currentMode === 'test') {
                if (testStatus !== 'waiting') return;
                const note = NOTES.find(n => n.id === noteId);
                playSingleTone(note.freq, getAudioContext().currentTime);
                triggerKeyActiveAnimation(note);
                checkAnswer(note);
                return;
            }

            // 3. 和弦盲测模式 (多选交互)
            if (currentMode === 'chord') {
                if (testStatus !== 'waiting') return;
                
                const idx = selectedNotes.indexOf(noteId);
                if (idx > -1) {
                    // 已选中，则取消选中
                    selectedNotes.splice(idx, 1);
                } else {
                    // 未选中，如果未达到上限则添加
                    if (selectedNotes.length < chordDifficulty) {
                        selectedNotes.push(noteId);
                        // 播放一下点击的这个音给用户校对
                        const note = NOTES.find(n => n.id === noteId);
                        playSingleTone(note.freq, getAudioContext().currentTime);
                    }
                }
                
                renderKeyboardState();
                renderScreen();
            }
        }

        // --- 单音测试业务 ---
        function startNewTest() {
            const randomIndex = Math.floor(Math.random() * NOTES.length);
            targetNote = NOTES[randomIndex];
            testStatus = 'waiting';
            feedback = null;
            renderScreen();
            renderKeyboardState();
            
            setTimeout(() => {
                playSingleTone(targetNote.freq, getAudioContext().currentTime);
            }, 300);
        }

        function replayTargetTone() {
            if (targetNote) {
                playSingleTone(targetNote.freq, getAudioContext().currentTime);
            }
        }

        function checkAnswer(guessedNote) {
            const isCorrect = guessedNote.id === targetNote.id;
            testStatus = 'result';
            
            if (isCorrect) {
                feedback = { type: 'success', text: `回答正确！正是 ${targetNote.name} (${targetNote.id})` };
                score.correct++;
            } else {
                feedback = { type: 'error', text: `答错了。刚才的音是 ${targetNote.name} (${targetNote.id})，你选了 ${guessedNote.name}` };
            }
            score.total++;
            
            renderScreen();
            renderKeyboardState();
        }

        // --- 和弦测试业务 ---
        function setChordDifficulty(diff) {
            chordDifficulty = diff;
            // 切换难度重置得分和当前题目
            chordScore = { correct: 0, total: 0 };
            testStatus = 'idle';
            selectedNotes = [];
            targetChordNotes = [];
            renderScreen();
            renderKeyboardState();
        }

        function startNewChordTest() {
            selectedNotes = [];
            testStatus = 'waiting';
            feedback = null;

            // 随机生成不重复的音符组合
            const tempNotes = [...NOTES];
            const shuffled = tempNotes.sort(() => 0.5 - Math.random());
            targetChordNotes = shuffled.slice(0, chordDifficulty);
            // 将目标音符按照音高从低到高排序，方便后面显示和对比
            targetChordNotes.sort((a, b) => a.freq - b.freq);

            renderScreen();
            renderKeyboardState();

            setTimeout(() => {
                playChord(targetChordNotes);
            }, 300);
        }

        function replayTargetChord() {
            if (targetChordNotes.length > 0) {
                playChord(targetChordNotes);
            }
        }

        function submitChordAnswer() {
            if (selectedNotes.length !== chordDifficulty) return;

            testStatus = 'result';
            
            // 排序，看是否完全一致
            const targetIds = targetChordNotes.map(n => n.id).sort();
            const sortedSelected = [...selectedNotes].sort();

            const isAllCorrect = targetIds.every((val, index) => val === sortedSelected[index]);
            
            // 生成解析文本
            const targetNames = targetChordNotes.map(n => `${n.name}(${n.id})`).join(' + ');
            
            if (isAllCorrect) {
                feedback = { type: 'success', text: `完全正确！和弦组成音：${targetNames}` };
                chordScore.correct++;
            } else {
                // 计算猜对了几个
                const correctCount = sortedSelected.filter(id => targetIds.includes(id)).length;
                feedback = { 
                    type: 'error', 
                    text: `不完全正确（猜对 ${correctCount}/${chordDifficulty} 个）。正确答案是：${targetNames}` 
                };
            }
            chordScore.total++;

            renderScreen();
            renderKeyboardState();
        }

        // --- 全局切换模式 ---
        function switchMode(newMode) {
            currentMode = newMode;
            
            // 更新导航按钮激活样式
            const btnPractice = document.getElementById('btn-practice');
            const btnTest = document.getElementById('btn-test');
            const btnChord = document.getElementById('btn-chord');
            
            [btnPractice, btnTest, btnChord].forEach(btn => {
                btn.className = "flex-1 py-2.5 px-2 rounded-xl font-medium text-sm transition-all duration-200 text-slate-500 hover:bg-slate-50";
            });

            if (newMode === 'practice') {
                btnPractice.className = "flex-1 py-2.5 px-2 rounded-xl font-medium text-sm transition-all duration-200 bg-blue-50 text-blue-700 shadow-sm";
            } else if (newMode === 'test') {
                btnTest.className = "flex-1 py-2.5 px-2 rounded-xl font-medium text-sm transition-all duration-200 bg-blue-50 text-blue-700 shadow-sm";
                score = { correct: 0, total: 0 };
                testStatus = 'idle';
                feedback = null;
                targetNote = null;
            } else if (newMode === 'chord') {
                btnChord.className = "flex-1 py-2.5 px-2 rounded-xl font-medium text-sm transition-all duration-200 bg-blue-50 text-blue-700 shadow-sm";
                chordScore = { correct: 0, total: 0 };
                testStatus = 'idle';
                selectedNotes = [];
                targetChordNotes = [];
                feedback = null;
            }
            
            activeNoteId = null;
            renderScreen();
            renderKeyboardState();
        }

        // --- 6. UI 渲染逻辑 ---

        // 普通点击瞬时动画
        function triggerKeyActiveAnimation(note) {
            const btn = document.getElementById(`key-${note.id}`);
            const nameSpan = document.getElementById(`name-${note.id}`);
            const idSpan = document.getElementById(`id-${note.id}`);

            btn.classList.add('key-active', note.activeColor);
            btn.classList.remove('bg-white');
            nameSpan.classList.add('text-white');
            nameSpan.classList.remove('text-slate-700');
            idSpan.classList.add('text-white/80');
            idSpan.classList.remove('text-slate-400');

            setTimeout(() => {
                btn.classList.remove('key-active', note.activeColor);
                btn.classList.add('bg-white');
                nameSpan.classList.remove('text-white');
                nameSpan.classList.add('text-slate-700');
                idSpan.classList.remove('text-white/80');
                idSpan.classList.add('text-slate-400');
            }, 300);
        }

        // 生成底部琴键
        function renderKeyboard() {
            const keyboardDiv = document.getElementById('keyboard');
            let html = '';
            
            NOTES.forEach(note => {
                html += `
                <button
                    id="key-${note.id}"
                    onmousedown="handleNoteClick('${note.id}')"
                    ontouchstart="event.preventDefault(); handleNoteClick('${note.id}')"
                    class="relative flex-1 rounded-b-xl rounded-t-sm flex flex-col items-center justify-end pb-4 pt-16 sm:pt-24 transition-all bg-white shadow-md border border-slate-200 hover:-translate-y-1 hover:shadow-lg cursor-pointer"
                >
                    <div class="absolute top-0 left-0 right-0 h-2 sm:h-3 ${note.color} rounded-t-sm opacity-80"></div>
                    <span id="name-${note.id}" class="font-bold text-base sm:text-xl mb-1 text-slate-700 transition-colors">${note.name}</span>
                    <span id="id-${note.id}" class="text-[10px] sm:text-xs font-mono text-slate-400 transition-colors">${note.id}</span>
                </button>
                `;
            });
            keyboardDiv.innerHTML = html;
        }

        // 更新琴键可用状态及多选高亮状态
        function renderKeyboardState() {
            NOTES.forEach(note => {
                const btn = document.getElementById(`key-${note.id}`);
                const nameSpan = document.getElementById(`name-${note.id}`);
                const idSpan = document.getElementById(`id-${note.id}`);

                // 重置部分样式
                btn.classList.remove('key-selected', 'opacity-50', 'cursor-not-allowed', 'grayscale', 'border-green-500', 'bg-green-50');
                btn.classList.add('hover:-translate-y-1', 'hover:shadow-lg', 'cursor-pointer');

                if (currentMode === 'practice') {
                    // 练习模式一切正常
                    return;
                }

                if (currentMode === 'test') {
                    if (testStatus !== 'waiting') {
                        btn.classList.add('opacity-50', 'cursor-not-allowed', 'grayscale');
                        btn.classList.remove('hover:-translate-y-1', 'hover:shadow-lg', 'cursor-pointer');
                    }
                }

                if (currentMode === 'chord') {
                    if (testStatus !== 'waiting') {
                        // 如果选好答案了，或者还没开始，将所有按键置灰
                        btn.classList.add('opacity-50', 'cursor-not-allowed', 'grayscale');
                        btn.classList.remove('hover:-translate-y-1', 'hover:shadow-lg', 'cursor-pointer');
                        
                        // 如果这个琴键在结果展示里是正确答案之一，给一个绿框标出
                        if (testStatus === 'result' && targetChordNotes.some(n => n.id === note.id)) {
                            btn.classList.remove('grayscale', 'opacity-50');
                            btn.classList.add('border-green-500', 'bg-green-50');
                        }
                    } else {
                        // 答题中，标记被多选选中的键
                        if (selectedNotes.includes(note.id)) {
                            btn.classList.add('key-selected');
                        }
                    }
                }
            });
        }

        // 更新屏幕区域
        function renderScreen() {
            const screen = document.getElementById('screen-content');
            let html = '';

            // 1. 练习模式
            if (currentMode === 'practice') {
                const note = NOTES.find(n => n.id === activeNoteId);
                html = `
                    <p class="text-slate-400 mb-1 font-medium tracking-wider text-xs sm:text-sm">当前发声</p>
                    <div class="text-4xl sm:text-5xl font-bold tracking-tight mb-1 h-14 flex items-center justify-center">
                        ${note ? `<span class="animate-pulse text-blue-400">${note.name}</span>` : `<span class="text-slate-600">--</span>`}
                    </div>
                    <div class="text-lg text-slate-400 font-mono h-6">
                        ${note ? note.id : '<span class="text-xs">点击下方琴键发出声音</span>'}
                    </div>
                `;
            } 
            // 2. 单音测试
            else if (currentMode === 'test') {
                const accuracy = score.total > 0 ? Math.round((score.correct / score.total) * 100) : 0;
                html += `
                    <div class="flex justify-between items-center w-full px-2 sm:px-4 mb-4 text-xs text-slate-300">
                        <span>测试：单音盲测</span>
                        <span>正确率: ${accuracy}% (${score.correct}/${score.total})</span>
                    </div>
                `;

                if (testStatus === 'idle') {
                    html += `
                        <div class="flex flex-col items-center">
                            <p class="text-slate-300 mb-4 text-sm">测试你对单个绝对音高的辨识度</p>
                            <button onclick="startNewTest()" class="bg-blue-500 hover:bg-blue-600 text-white rounded-full px-6 sm:px-8 py-2.5 flex items-center font-medium transition-transform active:scale-95 text-sm">
                                ${SVGS.playCircle} 开始测试
                            </button>
                        </div>
                    `;
                } else if (testStatus === 'waiting') {
                    html += `
                        <div class="flex flex-col items-center">
                            <p class="text-blue-300 mb-4 animate-pulse text-sm">仔细听，这是哪个音？</p>
                            <button onclick="replayTargetTone()" class="bg-white/10 hover:bg-white/20 text-white rounded-full px-5 py-2 flex items-center text-xs transition-colors border border-white/20">
                                ${SVGS.volume2} 再听一次
                            </button>
                        </div>
                    `;
                } else if (testStatus === 'result') {
                    const iconSvg = feedback.type === 'success' ? SVGS.checkCircle : SVGS.xCircle;
                    const colorClass = feedback.type === 'success' ? 'text-green-400' : 'text-red-400';
                    
                    html += `
                        <div class="flex flex-col items-center max-w-md">
                            <div class="flex items-center mb-4 text-sm sm:text-base ${colorClass} font-semibold">
                                ${iconSvg}
                                <span>${feedback.text}</span>
                            </div>
                            <button onclick="startNewTest()" class="bg-white/10 hover:bg-white/20 text-white rounded-full px-6 py-2.5 flex items-center text-sm font-medium transition-transform active:scale-95 border border-white/20">
                                ${SVGS.refreshCw} 下一个音
                            </button>
                        </div>
                    `;
                }
            } 
            // 3. 和弦高阶测试
            else if (currentMode === 'chord') {
                const accuracy = chordScore.total > 0 ? Math.round((chordScore.correct / chordScore.total) * 100) : 0;
                html += `
                    <div class="flex justify-between items-center w-full px-2 sm:px-4 mb-4 text-xs text-slate-300">
                        <div class="flex gap-2">
                            <button onclick="setChordDifficulty(2)" class="px-2 py-0.5 rounded ${chordDifficulty === 2 ? 'bg-blue-600 font-bold' : 'bg-slate-800'}">双音难度</button>
                            <button onclick="setChordDifficulty(3)" class="px-2 py-0.5 rounded ${chordDifficulty === 3 ? 'bg-blue-600 font-bold' : 'bg-slate-800'}">三音和弦</button>
                        </div>
                        <span>正确率: ${accuracy}% (${chordScore.correct}/${chordScore.total})</span>
                    </div>
                `;

                if (testStatus === 'idle') {
                    html += `
                        <div class="flex flex-col items-center">
                            <p class="text-slate-300 mb-4 text-sm">将同时播放 ${chordDifficulty} 个音，请用耳朵全部揪出来！</p>
                            <button onclick="startNewChordTest()" class="bg-blue-500 hover:bg-blue-600 text-white rounded-full px-8 py-2.5 flex items-center font-medium transition-transform active:scale-95 text-sm">
                                ${SVGS.playCircle} 播放和弦
                            </button>
                        </div>
                    `;
                } else if (testStatus === 'waiting') {
                    const remaining = chordDifficulty - selectedNotes.length;
                    html += `
                        <div class="flex flex-col items-center w-full">
                            <p class="text-blue-300 mb-2 animate-pulse text-sm">
                                正在合奏！请在下方选择 <strong class="text-white text-base">${chordDifficulty}</strong> 个音符 
                                (已选: ${selectedNotes.length}/${chordDifficulty})
                            </p>
                            <div class="flex gap-3 mb-4">
                                <button onclick="replayTargetChord()" class="bg-white/10 hover:bg-white/20 text-white rounded-full px-4 py-1.5 flex items-center text-xs transition-colors border border-white/20">
                                    ${SVGS.volume2} 重播和弦
                                </button>
                                <button 
                                    onclick="submitChordAnswer()" 
                                    ${remaining === 0 ? '' : 'disabled'} 
                                    class="rounded-full px-6 py-1.5 text-xs font-semibold transition-all ${remaining === 0 ? 'bg-green-500 hover:bg-green-600 text-white cursor-pointer' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}"
                                >
                                    确认提交
                                </button>
                            </div>
                        </div>
                    `;
                } else if (testStatus === 'result') {
                    const iconSvg = feedback.type === 'success' ? SVGS.checkCircle : SVGS.xCircle;
                    const colorClass = feedback.type === 'success' ? 'text-green-400' : 'text-red-400';
                    
                    html += `
                        <div class="flex flex-col items-center max-w-md">
                            <div class="flex items-center mb-4 text-xs sm:text-sm ${colorClass} font-semibold">
                                ${iconSvg}
                                <span>${feedback.text}</span>
                            </div>
                            <button onclick="startNewChordTest()" class="bg-white/10 hover:bg-white/20 text-white rounded-full px-6 py-2.5 flex items-center text-sm font-medium transition-transform active:scale-95 border border-white/20">
                                ${SVGS.refreshCw} 下一组和弦
                            </button>
                        </div>
                    `;
                }
            }

            screen.innerHTML = html;
        }

        // --- 7. 初始化 ---
        window.onload = () => {
            renderKeyboard();
            renderScreen();
        };
    </script>
</body>
</html>
